/* ---------- VIDEO ---------- */
 video {
        position: relative;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        }

        .absolute {
            position: absolute;
        }

        .active {
            z-index: 20;
        }

        .inactive {
            z-index: 19;
        }

        #startButton {
            position: fixed;
            z-index: 100;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 20px 35px;

            font-size: 20px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            cursor: pointer;
        }

/* ---------- START BUTTON ---------- */
#startButton {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 110;
    font-family:neue;
    display: flex;
    align-items: center;
    justify-content: center;

    width: 200px;
    height: 80px;
    border: none;
    border-radius: 40px;
    
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 18px;
    cursor: pointer;
    
    backdrop-filter: blur(5px);
    transition: all 0.3s ease;
}

#startButton:hover {
    background: rgba(255,255,255,0.35);
    transform: translateX(-50%) scale(1.1);
}        
/* ---------- SCROLL ARROW ---------- */
.scroll-arrow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 110;
    
    display: flex;
    align-items: center;
    justify-content: center;

    height: 40px;
    border: none;

    color: white;
    font-size: 40px;
    cursor: pointer;
    
    backdrop-filter: blur(5px);
    transition: all 0.3s ease;
}

.scroll-arrow:hover {
    background: rgba(255,255,255,0.35);
    transform: translateX(-50%) scale(1.1);
}

.scroll-arrow span {
    transform: translateY(-8px);

<script>

/* FADE-IN ON SCROLL */

const images = document.querySelectorAll('.image-wrapper');

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add('visible');

        }

    });

},{
    threshold:0.15
});

images.forEach(image=>{
    observer.observe(image);
});



// ---------- SCROLL ARROW ----------

function scrollPastVideo() {
    const videoSection = document.getElementById('videoA');

    window.scrollTo({
        top: 960,
        behavior: 'smooth'
    });
}

        // ==========================================
        // PLAYLIST
        // ==========================================

        const videos = [
            "videos/vidintro.mp4",
            "videos/vid1.mp4",
            "videos/vid24.mp4",
            "videos/vid2.mp4",
            "videos/vid15.mp4",
            "videos/vid13.mp4", 
            "videos/vid3.mp4",
            "videos/vidbig.mp4",
           "videos/vid8.mp4",
           "videos/vid7.mp4",
           "videos/vid17.mp4",
           "videos/vid21.mp4",
           "videos/vid22.mp4",
           "videos/vid23.mp4",
           "videos/vid25.mp4",
           "videos/vid19.mp4",
           "videos/vid4.mp4",
           "videos/vid11.mp4",
           "videos/vidoutro.mp4"
            

        ];


        // ==========================================
        // PLAYERS
        // ==========================================

        const videoA = document.getElementById("videoA");
        const videoB = document.getElementById("videoB");
        const startButton = document.getElementById("startButton");

        let active = videoA;
        let standby = videoB;

        let currentIndex = 0;


        // ==========================================
        // WAIT UNTIL VIDEO IS READY
        // ==========================================

        function waitUntilReady(video) {

            return new Promise((resolve, reject) => {

                // Already sufficiently loaded
                if (video.readyState >= 3) {
                    resolve();
                    return;
                }

                function ready() {
                    cleanup();
                    resolve();
                }

                function error() {
                    cleanup();
                    reject(new Error("Video failed to load"));
                }

                function cleanup() {
                    video.removeEventListener("canplay", ready);
                    video.removeEventListener("error", error);
                }

                video.addEventListener("canplay", ready);
                video.addEventListener("error", error);
            });
        }


        // ==========================================
        // LOAD A VIDEO
        // ==========================================

        function loadVideo(player, index) {

            player.src = videos[index];
            player.load();

            return waitUntilReady(player);
        }


        // ==========================================
        // PREPARE NEXT VIDEO
        // ==========================================

        async function prepareNext() {

            const nextIndex =
                (currentIndex + 1) % videos.length;

            try {

                await loadVideo(standby, nextIndex);

                console.log(
                    "Next video ready:",
                    videos[nextIndex]
                );

                return true;

            } catch (error) {

                console.error(
                    "Could not load:",
                    videos[nextIndex],
                    error
                );

                return false;
            }
        }


        // ==========================================
        // PLAY NEXT VIDEO
        // ==========================================

        async function playNext() {

            const nextIndex =
                (currentIndex + 1) % videos.length;


            // Make absolutely sure the next video
            // is ready before changing the screen.

            try {
                await waitUntilReady(standby);
            } catch (error) {

                console.error("Next video not ready");

                // Try loading it again
                await loadVideo(standby, nextIndex);
            }


            // Start the next video while it is still
            // underneath the currently visible video.

            try {
                await standby.play();
            } catch (error) {

                console.error(
                    "Could not play next video:",
                    error
                );

                // Try again after a short delay
                setTimeout(playNext, 100);
                return;
            }


            // ======================================
            // SWAP
            // ======================================

            const oldActive = active;

            active = standby;
            standby = oldActive;

            currentIndex = nextIndex;


            // New video becomes visible
            active.classList.add("active");
            active.classList.remove("inactive");

            standby.classList.add("inactive");
            standby.classList.remove("active");


            // Stop the old video
            standby.pause();
            standby.currentTime = 0;


            // ======================================
            // PRELOAD VIDEO AFTER NEXT
            // ======================================

            const afterNext =
                (currentIndex + 1) % videos.length;

            loadVideo(standby, afterNext)
                .then(() => {

                    console.log(
                        "Preloaded:",
                        videos[afterNext]
                    );

                })
                .catch(error => {

                    console.error(
                        "Preload failed:",
                        error
                    );

                });


            // Wait for this video to finish
            active.onended = playNext;
        }


        // ==========================================
        // START
        // ==========================================

        async function start() {

            startButton.style.display = "none";

            try {

                // Make sure first video is ready
                await waitUntilReady(active);

                // Start first video
                await active.play();


                // Prepare second video immediately
                prepareNext();


                // Fullscreen
                if (document.documentElement.requestFullscreen) {

                    try {
                        await document.documentElement.requestFullscreen();
                    } catch (e) {
                        console.log(
                            "Fullscreen request was blocked"
                        );
                    }
                }


                // First video finished
                active.onended = playNext;

            } catch (error) {

                console.error(error);

                startButton.style.display = "block";
            }
        }


        // ==========================================
        // INITIALIZE
        // ==========================================

        videoA.classList.add("active");
        videoB.classList.add("inactive");


        // Load first video
        loadVideo(videoA, 0)
            .then(() => {

                console.log("First video ready");

                // Try autoplay
                return videoA.play();

            })
            .then(() => {

                startButton.style.display = "none";

                // Start preloading video 2
                prepareNext();

                // Set up loop
                videoA.onended = playNext;

            })
            .catch(() => {

                // Autoplay blocked.
                // User needs to click.

                startButton.style.display = "block";
            });


        // ==========================================
        // START BUTTON
        // ==========================================

        startButton.addEventListener("click", start);

setTimeout(() => {

};

img.style.opacity = 0;

setTimeout(() => {

img.onload = () => {
